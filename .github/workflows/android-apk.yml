name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Remove AndroidIDE AAPT2 override
        run: |
          if [ -f gradle.properties ]; then
            sed -i '/aapt2FromMavenOverride/d' gradle.properties
          fi

      - name: Restore original signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          echo "Chave restaurada:"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android | grep -i SHA256

      - name: Permission for Gradle wrapper
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Sign APK with original JM key
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -type f -name apksigner 2>/dev/null \
            | sort -V \
            | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "ERRO: apksigner não encontrado."
            exit 1
          fi

          echo "Usando: $APKSIGNER"

          INPUT="app/build/outputs/apk/debug/app-debug.apk"
          OUTPUT="app/build/outputs/apk/debug/JM-Estoque-v9.4.5.apk"

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUTPUT" \
            "$INPUT"

          echo
          echo "===== ASSINATURA FINAL ====="

          "$APKSIGNER" verify --print-certs "$OUTPUT"

      - name: Confirm correct certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" \
            -type f -name apksigner 2>/dev/null \
            | sort -V \
            | tail -n 1)"

          APK="app/build/outputs/apk/debug/JM-Estoque-v9.4.5.apk"

          CERT="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*SHA-256 digest: //p' \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ': ')"

          EXPECTED="0775b31306bda3cd0787fb2d509bdc2e9bd15e7e7ca33d236b0a42067714fde5"

          echo "Encontrado: $CERT"
          echo "Esperado:   $EXPECTED"

          if [ "$CERT" != "$EXPECTED" ]; then
            echo "ERRO: APK continua com assinatura incorreta."
            exit 1
          fi

          echo "OK: assinatura correta confirmada."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JM-Estoque-v9.4.5
          path: app/build/outputs/apk/debug/JM-Estoque-v9.4.5.apk
          if-no-files-found: error
          retention-days: 30
